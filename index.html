<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>CloudFront iframe 測試</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      font-family: system-ui, sans-serif;
      background: #f1f5f9;
      color: #0f172a;
    }

    .container {
      max-width: 1200px;
      margin: auto;
    }

    iframe {
      width: 100%;
      height: 700px;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      background: white;
    }

    .status {
      margin-bottom: 16px;
      padding: 12px;
      background: white;
      border-radius: 8px;
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>CloudFront iframe 測試</h1>

    <div class="status" id="status">
      iframe 載入中……
    </div>

    <iframe
      id="test-frame"
      src="https://d1iheob5a1an0y.cloudfront.net"
      title="CloudFront React Application"
      allow="clipboard-read; clipboard-write"
    ></iframe>
  </main>

  <script>
    const frame = document.getElementById("test-frame");
    const status = document.getElementById("status");

    frame.addEventListener("load", () => {
      status.textContent = "iframe load 事件已觸發";
      status.style.color = "#15803d";
    });
  </script>
</body>
</html>
